name: Platinum QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Isolated policy tests
        run: |
          if [ -f tests/platinum-smoke.php ]; then php tests/platinum-smoke.php; fi

  wordpress-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-qa
          MARIADB_DATABASE: wordpress_qa
          MARIADB_USER: wordpress_qa
          MARIADB_PASSWORD: disposable-qa-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - name: Install disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          CLI="$RUNNER_TEMP/wp-cli.phar"
          WP="$RUNNER_TEMP/platinum-wordpress"
          curl --fail --silent --show-error --location https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar --output "$CLI"
          php "$CLI" --info
          php "$CLI" core download --version=6.8.3 --path="$WP"
          php "$CLI" --path="$WP" config create --dbname=wordpress_qa --dbuser=wordpress_qa --dbpass=disposable-qa-password --dbhost=127.0.0.1:3306
          php "$CLI" --path="$WP" config set BE_DISPOSABLE_QA true --raw
          php "$CLI" --path="$WP" config set WP_ENVIRONMENT_TYPE local
          php "$CLI" --path="$WP" core install --url=http://localhost:8080 --title="Disposable Platinum QA" --admin_user=qa --admin_password=disposable-admin-qa --admin_email=qa@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP/wp-content/plugins/bodyenergy-wordpress"
          php "$CLI" --path="$WP" plugin activate bodyenergy-wordpress
          php "$CLI" --path="$WP" core version
          php "$CLI" --path="$WP" eval-file "$GITHUB_WORKSPACE/tests/wordpress-core-smoke.php"
